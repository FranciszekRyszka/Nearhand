name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Formatting and the wasm constraint on `core` are platform-independent, so
  # they run once rather than once per OS.
  lint:
    name: fmt + core-on-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # `core` must keep compiling for the browser viewer.
      # Cheap to enforce now, painful to retrofit later.
      - run: cargo check -p nearhand-core --target wasm32-unknown-unknown

  test:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # RUSTFLAGS replaces .cargo/config.toml's flags, so Windows repeats
          # its static C runtime here.
          - os: windows-latest
            rustflags: -D warnings -C target-feature=+crt-static
          - os: macos-latest
            rustflags: -D warnings
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  deny:
    name: licences + advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The agent's MSI, unsigned until there is a code-signing certificate. Kept
  # as an artifact of each run, for testing in a VM.
  msi:
    name: agent MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # WiX 5: from 6 on, WiX asks for its maintenance-fee licence to be
      # accepted.
      - run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - run: ./packaging/windows/build-msi.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: nearhand-agent-msi
          path: target/release/nearhand-agent-*-x64.msi
          if-no-files-found: error
