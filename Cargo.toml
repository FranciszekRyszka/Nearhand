[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/FranciszekRyszka/Nearhand"

[workspace.lints.rust]
# Deny-by-default in edition 2024 already; stated explicitly because the
# platform backends are full of `unsafe` and the rule must not silently relax.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"

# Small, fast release binaries
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Password hashing is slow on purpose, and unoptimised it is slow enough to
# stall the tests and a debug server. Optimise just those crates.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
