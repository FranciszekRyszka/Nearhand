# cargo-deny configuration — licences and security advisories.
# Run locally with: cargo deny check

[graph]
# The platforms we actually ship. Without this, cargo-deny judges the whole
# lock file across every target and reports crates that never get built —
# winit's Linux/Wayland tree in particular.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    # The server is deployed on Linux (Docker, systemd); see docs/self-hosting.md.
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    # The browser viewer. [M6]
    "wasm32-unknown-unknown",
]

[advisories]
# Vulnerabilities always fail the build. "Unmaintained" is limited to crates we
# depend on directly — those are ours to replace. Flagging unmaintained crates
# five levels down inside winit or postcard only trains us to ignore the check,
# since there is nothing actionable at our end.
unmaintained = "workspace"
# Add advisory IDs here only with a comment explaining why they do not apply.
ignore = []

[licenses]
# Nearhand is Apache-2.0. Only permissive licences may enter the dependency
# tree; anything copyleft has to be rejected or replaced.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "0BSD",
    # clipboard-win, error-code — permissive, OSI approved.
    "BSL-1.0",
    # webpki-root-certs ships certificate data rather than code.
    "CDLA-Permissive-2.0",
    # epaint's default fonts. Font licences, not code licences: both permit
    # redistribution inside a binary, neither reaches our own source.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions bloat the binary, and we have a size target to hold.
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # We do not bundle a media stack; capture and encode use OS APIs.
    { name = "ffmpeg-sys-next" },
    { name = "webrtc" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
