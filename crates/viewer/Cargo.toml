[package]
name = "nearhand-viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
nearhand-capture = { version = "0.1.0", path = "../capture" }
nearhand-codec = { version = "0.1.0", path = "../codec" }
nearhand-core = { version = "0.1.0", path = "../core" }
nearhand-transport = { version = "0.1.0", path = "../transport" }
quinn = "0.11.12"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wgpu = "30.0.1"
winit = "0.30.13"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security"] }
