[package]
name = "nearhand-transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = "1.12.1"
nearhand-core = { version = "0.1.0", path = "../core" }
quinn = "0.11.12"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = "1.0.229"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync", "time", "rt"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
