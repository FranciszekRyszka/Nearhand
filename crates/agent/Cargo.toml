[package]
name = "nearhand-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
nearhand-capture = { version = "0.1.0", path = "../capture" }
nearhand-clipboard = { version = "0.1.0", path = "../clipboard" }
nearhand-codec = { version = "0.1.0", path = "../codec" }
nearhand-core = { version = "0.1.0", path = "../core" }
nearhand-input = { version = "0.1.0", path = "../input" }
nearhand-transport = { version = "0.1.0", path = "../transport" }
quinn = "0.11.12"
ring = "0.17.14"
serde = "1.0.229"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-service = "0.8.1"
