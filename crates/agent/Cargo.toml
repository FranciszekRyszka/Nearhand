[package]
name = "nearhand-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
nearhand-capture = { version = "0.1.0", path = "../capture" }
nearhand-clipboard = { version = "0.1.0", path = "../clipboard" }
nearhand-codec = { version = "0.1.0", path = "../codec" }
nearhand-core = { version = "0.1.0", path = "../core" }
nearhand-input = { version = "0.1.0", path = "../input" }
nearhand-transport = { version = "0.1.0", path = "../transport" }
quinn = "0.11.12"
serde = "1.0.229"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_HiDpi"] }
