[package]
name = "nearhand-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
nearhand-capture = { version = "0.1.0", path = "../capture" }
nearhand-codec = { version = "0.1.0", path = "../codec" }
nearhand-core = { version = "0.1.0", path = "../core" }
nearhand-input = { version = "0.1.0", path = "../input" }
quinn = "0.11.12"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[lints]
workspace = true
