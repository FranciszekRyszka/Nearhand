[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Foundation", "Win32_System_Com", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole"] }

[dev-dependencies]
tracing-subscriber = "0.3.23"
