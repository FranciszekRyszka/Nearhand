[package]
name = "nearhand-codec"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = "1.12.1"
nearhand-capture = { version = "0.1.0", path = "../capture" }
nearhand-core = { version = "0.1.0", path = "../core" }
thiserror = "2.0.20"
