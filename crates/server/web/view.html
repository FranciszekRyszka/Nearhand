<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Nearhand viewer</title>
<link rel="stylesheet" href="/view.css">
<script type="module" src="/view.js"></script>
</head>
<body>
<header>
  <a class="brand" href="/">Nearhand</a>
  <span id="device"></span>
  <select id="monitor" hidden></select>
  <span id="stats" class="quiet"></span>
  <button id="leave">Disconnect</button>
</header>
<main>
  <p id="status">Starting…</p>
  <canvas id="screen" hidden></canvas>
</main>
<noscript>The viewer needs JavaScript and WebAssembly.</noscript>
</body>
</html>
