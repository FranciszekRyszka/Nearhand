[package]
name = "nearhand-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
bytes = "1"
clap = { version = "4.6.7", features = ["derive"] }
nearhand-core = { version = "0.1.0", path = "../core" }
nearhand-transport = { version = "0.1.0", path = "../transport" }
postcard = { version = "1", features = ["use-std"] }
quinn = "0.11.12"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
ring = "0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.20"
time = "0.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
web-transport-quinn = { version = "0.12.1", default-features = false, features = ["ring"] }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
url = "2"
