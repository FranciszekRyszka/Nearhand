[package]
name = "nearhand-input"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nearhand-core = { version = "0.2.0", path = "../core" }
thiserror = "2.0.20"

[dev-dependencies]
# The hardware test aims at the same monitor rectangles the agent does.
nearhand-capture = { version = "0.2.0", path = "../capture" }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_HiDpi", "Win32_System_LibraryLoader"] }
